<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CO2 Rechner</title>
<link rel="stylesheet" href="./styles/co2-rechner.css">
</head>

<body>
<div class="container">

    <h1>Carbon Footprint Calculator</h1>

    <form id="co2Form" onsubmit="event.preventDefault(); calculateCO2();">

        <label>Name:</label>
        <input type="text" name="personName" required>

        <label>Destination:</label>
        <input type="text" name="destination" required>

        <label>Distance (km):</label>
        <input type="number" name="distance" required>

        <label>Transport:</label>
        <select name="transport">
            <option value="0.192">Car (gasoline)</option>
            <option value="0.045">Car (electric)</option>
            <option value="0.105">Bus</option>
            <option value="0.041">Train</option>
            <option value="0.255">Airplane (short-haul)</option>
            <option value="0.195">Airplane (long-haul)</option>
            <option value="0">Bicycle / Walking</option>
        </select>

        <button type="submit">Calculate</button>
    </form>

    <div id="result" class="result-box"></div>

</div>

<script src="./script/co2-rechner.js"></script>
</body>
</html>
